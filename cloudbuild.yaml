options:
  # Desactiva el logging (no genera bucket de logs ni envía a Cloud Logging)
  logging: NONE

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/pl-nodriver
      - .

  # Push the Docker image to Google Container Registry (GCR)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - gcr.io/$PROJECT_ID/pl-nodriver

  # Deploy to Cloud Run in multiple regions (parallel deployment)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        REGIONS=(
          "us-central1"  # Iowa
          "us-east1"     # South Carolina
          "us-east4"     # Northern Virginia
          "us-east5"     # Columbus
          "us-west1"     # Oregon
          "us-west2"     # Los Angeles
          "us-west3"     # Salt Lake City
          "us-west4"     # Las Vegas
          "us-south1"    # Dallas
        )

        for REGION in "${REGIONS[@]}"; do
          gcloud run deploy pl-nodriver \
            --image gcr.io/$PROJECT_ID/pl-nodriver \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 80 \
            --concurrency 1 \
            --memory 1Gi \
            --cpu 1 \
            --quiet &
        done

        wait  # Espera a que terminen todos los despliegues

timeout: '1200s'
