options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1. Construir la imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/pl-nodriver', '.']

  # 2. Subir la imagen al Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/pl-nodriver']

  # 3. Desplegar en us-central1
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      [
        'run', 'deploy', 'pl-nodriver',
        '--image', 'gcr.io/$PROJECT_ID/pl-nodriver',
        '--region', 'us-central1',
        '--platform', 'managed',
        '--allow-unauthenticated',
        '--port', '80',
        '--memory', '2Gi',
        '--cpu', '2',
        '--concurrency', '1'
      ]

  # 4. Desplegar en us-east1
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      [
        'run', 'deploy', 'pl-nodriver',
        '--image', 'gcr.io/$PROJECT_ID/pl-nodriver',
        '--region', 'us-east1',
        '--platform', 'managed',
        '--allow-unauthenticated',
        '--port', '80',
        '--memory', '2Gi',
        '--cpu', '2',
        '--concurrency', '1'
      ]

  # 5. Desplegar en us-east4
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      [
        'run', 'deploy', 'pl-nodriver',
        '--image', 'gcr.io/$PROJECT_ID/pl-nodriver',
        '--region', 'us-east4',
        '--platform', 'managed',
        '--allow-unauthenticated',
        '--port', '80',
        '--memory', '2Gi',
        '--cpu', '2',
        '--concurrency', '1'
      ]

  # 6. Desplegar en us-west1
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      [
        'run', 'deploy', 'pl-nodriver',
        '--image', 'gcr.io/$PROJECT_ID/pl-nodriver',
        '--region', 'us-west1',
        '--platform', 'managed',
        '--allow-unauthenticated',
        '--port', '80',
        '--memory', '2Gi',
        '--cpu', '2',
        '--concurrency', '1'
      ]
