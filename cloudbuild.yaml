options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/pl-nodriver', '.']

  # Push the Docker image to Google Container Registry (GCR)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/pl-nodriver']

  # Deploy to Cloud Run in us-central1
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - run
      - deploy
      - pl-nodriver
      - --image
      - gcr.io/$PROJECT_ID/pl-nodriver
      - --region
      - us-central1
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - '80'
      - --concurrency
      - '1'
      - --memory
      - 1Gi
      - --cpu
      - '1'
      - --quiet

  # Deploy to Cloud Run in us-east1
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - run
      - deploy
      - pl-nodriver
      - --image
      - gcr.io/$PROJECT_ID/pl-nodriver
      - --region
      - us-east1
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - '80'
      - --concurrency
      - '1'
      - --memory
      - 1Gi
      - --cpu
      - '1'
      - --quiet
